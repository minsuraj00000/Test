<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>QuizMaster</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#4f46e5,#7c3aed 45%,#db2777);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1e1b2e}.app{width:100%;max-width:560px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;min-height:520px;max-height:90vh;display:flex;flex-direction:column}.screen{display:none;flex-direction:column;flex:1;padding:32px 28px;animation:fadeIn .35s ease;overflow-y:auto}.screen.active{display:flex}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}#home{align-items:center;justify-content:center;text-align:center}#home h1{font-size:32px;background:linear-gradient(135deg,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}#home h2{font-size:17px;color:#4b5563;font-weight:600;margin-bottom:22px}#home p{color:#6b7280;font-size:14px;margin-bottom:26px}.btn{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;padding:13px 26px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(124,58,237,.35)}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(124,58,237,.45)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}.btn.secondary{background:#f3f4f6;color:#374151;box-shadow:none;margin-top:10px}.btn.secondary:hover{background:#e5e7eb;transform:none}.btn.small{padding:9px 18px;font-size:13px}.btn.submit{background:linear-gradient(135deg,#16a34a,#22c55e)}.btn-row{display:flex;gap:10px;margin-top:6px}.stat{font-size:13px;color:#9ca3af;margin-top:18px}#quiz .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#quiz .qcount{font-size:13px;color:#6b7280;font-weight:600}#quiz .timerText{font-size:13px;color:#db2777;font-weight:700}.progress-track{height:6px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-bottom:8px}.progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#db2777);transition:width .3s}.timer-track{height:5px;background:#f3f4f6;border-radius:6px;overflow:hidden;margin-bottom:22px}.timer-fill{height:100%;background:#f59e0b;transition:width .2s linear}#quiz .qtext{font-size:19px;font-weight:700;color:#1f2937;margin-bottom:20px;line-height:1.4}.options{display:flex;flex-direction:column;gap:10px;flex:1}.opt{text-align:left;padding:13px 16px;border-radius:12px;border:2px solid #e5e7eb;background:#fafafa;font-size:14.5px;color:#374151;cursor:pointer;transition:all .15s}.opt:hover{border-color:#c4b5fd;background:#f5f3ff}.opt.selected{border-color:#7c3aed;background:#f5f3ff;color:#5b21b6;font-weight:600}.opt.correct{border-color:#22c55e;background:#dcfce7;color:#166534;font-weight:600}.opt.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b;font-weight:600}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.navrow .btn{flex:1}#result{align-items:center;justify-content:center;text-align:center}.ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#7c3aed calc(var(--pct)*1%),#e5e7eb 0);margin-bottom:20px}.ring-inner{width:112px;height:112px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-inner b{font-size:26px;color:#1f2937}.ring-inner span{font-size:11px;color:#9ca3af}#result h2{font-size:22px;color:#1f2937;margin-bottom:4px}#result p{color:#6b7280;font-size:14px;margin-bottom:22px}#review .rev-item{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:10px}#review .rev-q{font-size:13.5px;font-weight:600;color:#1f2937;margin-bottom:6px}#review .rev-a{font-size:12.5px;margin-bottom:2px}#review .rev-a.ok{color:#16a34a}#review .rev-a.bad{color:#dc2626}#review .scroll{overflow-y:auto;flex:1;padding-right:4px}#review .scroll::-webkit-scrollbar{width:5px}#review .scroll::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}@media (max-width:420px){body{padding:14px}.app{max-width:100%;min-height:0;max-height:92vh;max-height:92dvh;border-radius:18px}.screen{padding:22px 18px}#home h1{font-size:26px}#home h2{font-size:16px;margin-bottom:4px}.btn{padding:12px 20px;font-size:14px}#quiz .qtext{font-size:16.5px;margin-bottom:14px}.opt{padding:11px 13px;font-size:13.5px}.ring{width:110px;height:110px}.ring-inner{width:88px;height:88px}.ring-inner b{font-size:21px}#result h2{font-size:19px}.navrow{gap:8px}.navrow .btn{padding:11px 10px;font-size:13px}}@media (min-width:900px){.app{max-width:620px}#quiz .qtext{font-size:21px}.opt{padding:15px 18px;font-size:15.5px}}</style></head><body><div class="app"><div id="home" class="screen active"><h1>🧠 Hi-Tech Computer</h1><h2>Computer Network</h2><button class="btn" id="startBtn">Start Test</button><p class="stat">31 questions • 30 min total</p></div><div id="quiz" class="screen"><div class="topbar"><span class="qcount" id="qCount">Question 1/5</span> <span class="timerText" id="timerText">05:00</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div><div class="qtext" id="qText"></div><div class="options" id="optionsBox"></div><div class="navrow"><button class="btn secondary" id="prevBtn">← Previous</button> <button class="btn" id="nextBtn">Next →</button></div><button class="btn submit" id="submitBtn" style="margin-top:10px">Submit Test</button></div><div id="result" class="screen"><div class="ring" id="ring"><div class="ring-inner"><b id="scoreBig"></b><span>SCORE</span></div></div><h2 id="resultTitle"></h2><p id="resultSub"></p><button class="btn" id="reviewBtn">Review Answers</button></div><div id="review" class="screen"><h3 style="font-size:15px;color:#1f2937;margin-bottom:12px">Answer Review</h3><div class="scroll" id="reviewList"></div><button class="btn secondary" id="backFromReview">Back to Result</button></div></div><script>const questions=[{q:"1. Computer Network क्या है ?",opts:["एक कंप्यूटर","आपस में जुड़े कंप्यूटरों का समूह","एक Software","एक Printer"],correct:1},{q:"2. LAN का पूरा नाम क्या है?",opts:["Local Area Network","Large Area Network","Long Area Network","Light Area Network"],correct:0},{q:"3. WAN का पूरा नाम क्या है?",opts:["Wide Area Network","Web Area Network","Wireless Area Network","World Area Network"],correct:0},{q:"4. MAN का पूरा नाम क्या है?",opts:["Main Area Network","Metropolitan Area Network","Medium Area Network","Machine Area Network"],correct:1},{q:"5. Internet किस प्रकार का Network है?",opts:["LAN","MAN","WAN","PAN"],correct:2},{q:"6. निम्न में से कौन-सा Network Device है?",opts:["Router","Keyboard","Monitor","Mouse"],correct:0},{q:"7. Network Cable का उदाहरण कौन-सा है?",opts:["Ethernet Cable","Power Cable","Audio Cable","HDMI Cable"],correct:0},{q:"8. LAN का उपयोग सामान्यतः कहाँ किया जाता है?",opts:["छोटे क्षेत्र में","पूरे देश में","पूरे विश्व में","केवल Satellite में"],correct:0},{q:"9. WAN का उपयोग किस क्षेत्र को Connect करने के लिए किया जा सकता है?",opts:["बहुत बड़े भौगोलिक क्षेत्र","केवल एक कमरे","केवल एक Keyboard","केवल एक Computer"],correct:0},{q:"10. Internet पर Website का Address क्या कहलाता है?",opts:["URL","CPU","RAM","USB"],correct:0},{q:"11. URL का पूरा नाम क्या है?",opts:["Uniform Resource Locator","Universal Radio Link","Uniform Router Location","User Resource Link"],correct:0},{q:"12. DNS का पूरा नाम क्या है?",opts:["Domain Name System","Data Network Service","Digital Name Server","Domain Network Software"],correct:0},{q:"13. HTTP का पूरा नाम क्या है?",opts:["HyperText Transfer Protocol","High Transfer Text Program","Hyper Transfer Technology Process","Home Text Transfer Protocol"],correct:0},{q:'14. HTTPS में "S" किसका संकेत देता है?',opts:["Secure","Server","System","Software"],correct:0},{q:"15. Network में Communication के नियमों को क्या कहा जाता है?",opts:["Protocol","Program","Folder","Driver"],correct:0},{q:"16. FTP का उपयोग मुख्य रूप से किसके लिए किया जाता है?",opts:["Files Transfer करने के लिए","Video बनाने के लिए","Computer Format करने के लिए","Keyboard चलाने के लिए"],correct:0},{q:"17. ई-मेल भेजने के लिए सामान्यतः कौन-सा Protocol उपयोग होता है?",opts:["SMTP","FTP","HTTP","ARP"],correct:0},{q:"18. SMTP का पूरा नाम क्या है?",opts:["Simple Mail Transfer Protocol","System Mail Transfer Program","Simple Message Text Protocol","Server Mail Transfer Process"],correct:0},{q:"19. Network में Data भेजने और प्राप्त करने वाले Device को क्या कहा जा सकता है?",opts:["Node","Folder","File","Pixel"],correct:0},{q:"20. IPv4 Address में कितने Bits होते हैं?",opts:["16","32","64","128"],correct:1},{q:"21. IPv6 Address में कितने Bits होते हैं?",opts:["32","64","128","256"],correct:2},{q:"22. इनमें से कौन Wireless Network का उदाहरण है?",opts:["Wi-Fi","Ethernet Cable","Coaxial Cable","Fiber Cable"],correct:0},{q:"23. Fiber Optic Cable में Data किसके माध्यम से Travel करता है?",opts:["Light","Sound","Electricity only","Magnetic Field"],correct:0},{q:"24. Network में Gateway का उपयोग किसके लिए किया जाता है?",opts:["अलग-अलग Networks के बीच Communication","केवल Printing","केवल Typing","केवल Storage"],correct:0},{q:"25. नेटवर्क में Data की गति को सामान्यतः किसमें मापा जाता है?",opts:["Bits per second","Kilogram","Meter","Celsius"],correct:0},{q:"26. Mbps का पूरा नाम क्या है?",opts:["Megabits per second","Megabytes per system","Memory bits per second","Mega byte protocol system"],correct:0},{q:"27. Peer-to-Peer Network में क्या होता है?",opts:["Computers सीधे एक-दूसरे से Resources Share कर सकते हैं","केवल एक Server होता है","कोई Computer Connect नहीं होता","केवल Printer Connect होता है"],correct:0},{q:"28. Client-Server Network में मुख्य भूमिका किसकी होती है?",opts:["Client और Server","केवल Keyboard","केवल Mouse","केवल Monitor"],correct:0},{q:"29. Network में Bandwidth का संबंध किससे है?",opts:["Data Transfer Capacity","Screen Brightness","Keyboard Speed","Storage Size"],correct:0},{q:"30. VPN का पूरा नाम क्या है?",opts:["Virtual Private Network","Virtual Public Network","Verified Private Node","Visual Protocol Network"],correct:0},{q:"31. Computer Network का प्रमुख लाभ क्या है?",opts:["Resource और Information Sharing","Computer का वजन बढ़ाना","बिजली बनाना","Monitor का आकार बढ़ाना"],correct:0}],TOTAL_TIME=1800;let timerInterval,timeLeft,current=0,selected=[];function $(e){return document.getElementById(e)}const screens={home:$("home"),quiz:$("quiz"),result:$("result"),review:$("review")};function show(e){Object.values(screens).forEach(e=>e.classList.remove("active")),screens[e].classList.add("active")}function startQuiz(){current=0,selected=new Array(questions.length).fill(-1),timeLeft=1800,show("quiz"),renderQuestion(),clearInterval(timerInterval),timerInterval=setInterval(()=>{timeLeft-=.2,updateTimerDisplay(),timeLeft<=0&&(clearInterval(timerInterval),finishQuiz())},200)}function updateTimerDisplay(){const e=Math.max(0,timeLeft),t=String(Math.floor(e/60)).padStart(2,"0"),r=String(Math.floor(e%60)).padStart(2,"0");$("timerText").textContent=`${t}:${r}`,$("timerFill").style.width=e/1800*100+"%"}function renderQuestion(){const e=questions[current];$("qCount").textContent=`Question ${current+1}/${questions.length}`,$("progressFill").style.width=current/(questions.length-1||1)*100+"%",$("qText").textContent=e.q;const t=$("optionsBox");t.innerHTML="",e.opts.forEach((e,r)=>{const o=document.createElement("button");o.className="opt"+(selected[current]===r?" selected":""),o.textContent=e,o.addEventListener("click",()=>{selected[current]=r,renderQuestion()}),t.appendChild(o)}),$("prevBtn").disabled=0===current,$("nextBtn").textContent=(questions.length,"Next →"),$("nextBtn").disabled=current===questions.length-1}function showConfirm(e,t){const r=document.createElement("div");r.style.cssText="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;",r.innerHTML=`\n    <div style="background:white; border-radius:16px; padding:24px; max-width:340px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.3); text-align:center;">\n      <p style="font-size:14.5px; color:#1f2937; margin-bottom:18px; line-height:1.5;">${e}</p>\n      <div style="display:flex; gap:10px;">\n        <button id="confirmNo" class="btn secondary" style="flex:1;">Cancel</button>\n        <button id="confirmYes" class="btn submit" style="flex:1;">Submit</button>\n      </div>\n    </div>\n  `,document.body.appendChild(r),r.querySelector("#confirmNo").addEventListener("click",()=>r.remove()),r.querySelector("#confirmYes").addEventListener("click",()=>{r.remove(),t()})}function finishQuiz(){clearInterval(timerInterval);let e=0;questions.forEach((t,r)=>{selected[r]===t.correct&&e++}),window._lastScore=e;const t=Math.round(e/questions.length*100);$("ring").style.setProperty("--pct",t),$("scoreBig").textContent=`${e}/${questions.length}`,$("resultTitle").textContent=t>=80?"Excellent! 🎉":t>=50?"Good Job! 👍":"Keep Practicing 💪",$("resultSub").textContent=`You scored ${t}% on this quiz.`,show("result")}$("startBtn").addEventListener("click",startQuiz),$("prevBtn").addEventListener("click",()=>{current>0&&(current--,renderQuestion())}),$("nextBtn").addEventListener("click",()=>{current<questions.length-1&&(current++,renderQuestion())}),$("submitBtn").addEventListener("click",()=>{showConfirm("Submit the test now? You won't be able to change answers after this.",finishQuiz)}),$("reviewBtn").addEventListener("click",()=>{const e=$("reviewList");e.innerHTML="",questions.forEach((t,r)=>{const o=selected[r],n=o===t.correct,s=o>=0?t.opts[o]:"(not answered)",i=document.createElement("div");i.className="rev-item",i.innerHTML=`\n      <div class="rev-q">${r+1}. ${t.q}</div>\n      <div class="rev-a ${n?"ok":"bad"}">Your answer: ${s}</div>\n      ${n?"":`<div class="rev-a ok">Correct answer: ${t.opts[t.correct]}</div>`}\n    `,e.appendChild(i)}),show("review")}),$("backFromReview").addEventListener("click",()=>show("result"))</script></body></html>
